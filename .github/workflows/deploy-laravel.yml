name: Deploy SuaveCreators to Hostinger via SSH

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy-to-staging:
    name: SuaveCreators Staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, pdo, bcmath, gd
          coverage: none

      # ---- CACHE NODE ----
      # - name: Cache Node Modules
      #   uses: actions/cache@v3
      #   with:
      #     path: ~/.npm
      #     key: node-${{ hashFiles('package-lock.json') }}

      # - name: Install Node dependencies
      #   run: npm install --prefer-offline --no-audit

      # - name: Build Vite assets
      #   run: npm run build

      - name: Cache Composer
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer Dependencies Locally
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install rsync
        run: |
          set -euo pipefail
          # GitHub Ubuntu runners ship Google Chrome apt sources (.list and/or
          # .sources). Chrome's CDN often fails apt-get update with Hash Sum
          # mismatch. Drop every dl.google.com source, then refresh Ubuntu only.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.list.save \
                     /etc/apt/sources.list.d/google-chrome.sources \
                     /etc/apt/sources.list.d/google-chrome.sources.save
          sudo grep -RIl --include='*.list' --include='*.sources' 'dl.google.com' /etc/apt/sources.list.d \
            2>/dev/null | sudo xargs -r rm -f || true
          sudo rm -rf /var/lib/apt/lists/partial /var/lib/apt/lists/dl.google.com*
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo apt-get update \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- \
              -o APT::Get::List-Cleanup=0
          else
            sudo apt-get update
          fi
          sudo apt-get install -y rsync sshpass

      - name: Upload only necessary files
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude=".git/" \
            --exclude="node_modules/" \
            --exclude="package.json" \
            --exclude="package-lock.json" \
            --exclude="vite.config.js" \
            --exclude="tests/" \
            --exclude=".github/" \
            --exclude=".cursor/" \
            --exclude="design/" \
            --exclude=".env" \
            --exclude="storage/" \
            --exclude="storage/framework/cache/data" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.STAGING_DIRECTORY }}/

      - name: Run server optimization commands
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -p ${{ secrets.SSH_PORT }} \
          -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.STAGING_DIRECTORY }}

            mkdir -p storage/app/public
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs

            # Prefer dynamic /robots.txt (SEO_NOINDEX / APP_ENV=staging)
            rm -f public/robots.txt

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan migrate --force
            php artisan storage:link

            echo "SuaveCreators staging deployment completed"
          EOF

  deploy-to-production:
    name: SuaveCreators Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, pdo, bcmath, gd
          coverage: none

      # ---- CACHE NODE ----
      # - name: Cache Node Modules
      #   uses: actions/cache@v3
      #   with:
      #     path: ~/.npm
      #     key: node-${{ hashFiles('package-lock.json') }}

      # - name: Install Node dependencies
      #   run: npm install --prefer-offline --no-audit

      # - name: Build Vite assets
      #   run: npm run build

      - name: Cache Composer
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer Dependencies Locally
        run: composer install --no-dev --optimize-autoloader --no-interaction
      
      - name: Install rsync
        run: |
          set -euo pipefail
          # GitHub Ubuntu runners ship Google Chrome apt sources (.list and/or
          # .sources). Chrome's CDN often fails apt-get update with Hash Sum
          # mismatch. Drop every dl.google.com source, then refresh Ubuntu only.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.list.save \
                     /etc/apt/sources.list.d/google-chrome.sources \
                     /etc/apt/sources.list.d/google-chrome.sources.save
          sudo grep -RIl --include='*.list' --include='*.sources' 'dl.google.com' /etc/apt/sources.list.d \
            2>/dev/null | sudo xargs -r rm -f || true
          sudo rm -rf /var/lib/apt/lists/partial /var/lib/apt/lists/dl.google.com*
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo apt-get update \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- \
              -o APT::Get::List-Cleanup=0
          else
            sudo apt-get update
          fi
          sudo apt-get install -y rsync sshpass

      - name: Upload only necessary files
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude=".git/" \
            --exclude="node_modules/" \
            --exclude="package.json" \
            --exclude="package-lock.json" \
            --exclude="vite.config.js" \
            --exclude="tests/" \
            --exclude=".github/" \
            --exclude=".cursor/" \
            --exclude="design/" \
            --exclude=".env" \
            --exclude="storage/" \
            --exclude="storage/framework/cache/data" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.PRODUCTION_DIRECTORY }}/

      - name: Run server optimization commands
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -p ${{ secrets.SSH_PORT }} \
          -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.PRODUCTION_DIRECTORY }}

            mkdir -p storage/app/public
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs

            # Prefer dynamic /robots.txt route
            rm -f public/robots.txt

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan migrate --force
            php artisan storage:link

            echo "SuaveCreators production deployment completed"
          EOF
